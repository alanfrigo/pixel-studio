[project]
name = "pixel-pipeline"
version = "0.1.0"
description = "Processamento raster local do Pixel Studio (protocolo JSON via stdin/stdout)"
requires-python = ">=3.14"
dependencies = ["pillow==13.0.0"]

[dependency-groups]
dev = ["pytest==9.0.3", "jsonschema==4.25.1", "coverage==7.17.3"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests", "../consumers/portable_reader"]

[tool.coverage.run]
source = ["pixel_pipeline", "../consumers/portable_reader"]
omit = ["*/test_*.py"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100
precision = 2
