[project]
name = "pixel-pipeline"
version = "0.1.0"
description = "Processamento raster local do Pixel Studio (protocolo JSON via stdin/stdout)"
requires-python = ">=3.14"
dependencies = ["pillow==13.0.0"]

[dependency-groups]
dev = ["pytest==9.0.3", "jsonschema==4.25.1"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests", "../consumers/portable_reader"]
